<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Florii · current color variants</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { min-height: 100vh; }
      .color-sheet { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 44px 0 58px; }
      .color-sheet header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
      .color-sheet h1 { font-size: clamp(42px, 6vw, 68px); }
      .color-sheet header p { max-width: 470px; margin: 0 0 7px; color: var(--muted); font: italic 13px/1.6 Georgia, serif; text-align: right; }
      .species-rows { display: grid; gap: 12px; }
      .species-row { display: grid; grid-template-columns: 150px repeat(3, 1fr); min-height: 188px; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: var(--shadow); }
      .species-title { display: flex; flex-direction: column; justify-content: center; padding: 20px 22px; border-right: 1px solid var(--line); }
      .species-title h2 { margin: 0; font-size: 24px; }
      .species-title span { margin-top: 7px; color: var(--muted); font-size: 8px; letter-spacing: .13em; text-transform: uppercase; }
      .variant { position: relative; display: grid; grid-template-columns: 118px minmax(0, 1fr); align-items: center; min-width: 0; border-right: 1px solid var(--line); }
      .variant:last-child { border-right: 0; }
      .variant-art { position: relative; align-self: stretch; overflow: hidden; background: linear-gradient(160deg, color-mix(in srgb, var(--primary) 21%, white), color-mix(in srgb, var(--secondary) 13%, #e5eadf)); }
      .variant-art::after { content: ""; position: absolute; inset: auto 0 0; height: 22%; background: #8f8068; clip-path: polygon(0 20%, 27% 5%, 63% 14%, 100% 0, 100% 100%, 0 100%); }
      .variant-art .specimen-plant { --plant-scale: 1.03; top: auto; bottom: 12%; z-index: 1; animation: none; transform: translateX(-50%) scale(var(--plant-scale)) scale(var(--genetic-scale)); }
      .variant-copy { min-width: 0; padding: 16px 13px; }
      .variant-copy strong { display: block; overflow: hidden; font: 16px Georgia, serif; text-overflow: ellipsis; white-space: nowrap; }
      .variant-copy > span { display: block; margin-top: 5px; color: var(--muted); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }
      .variant-swatches { display: flex; gap: 5px; margin-top: 13px; }
      .variant-swatches i { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.76); border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
      @media (max-width: 900px) {
        .species-row { grid-template-columns: 136px minmax(0, 1fr); }
        .species-title { grid-row: 1 / 4; min-width: 0; padding: 16px 12px; }
        .species-title h2 { font-size: 19px; }
        .variant { min-height: 168px; border-right: 0; border-bottom: 1px solid var(--line); }
        .variant:last-child { border-bottom: 0; }
      }
    </style>
  </head>
  <body>
    <main id="florii-color-preview" class="color-sheet">
      <header>
        <div>
          <p class="eyebrow">the live renderer</p>
          <h1>Current Florii</h1>
        </div>
        <p>Three individuals per species, generated by Florii’s current phenotype algorithm and drawn by the exact renderer used in the garden.</p>
      </header>
      <section id="species-rows" class="species-rows" aria-label="Current Florii color variants"></section>
    </main>
    <script type="module" src="/current-colors.js"></script>
  </body>
</html>
